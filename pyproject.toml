[project]
name = "basketvision"
version = "0.1.0"
description = "Local-first basketball shooting form analysis with OpenCV and MediaPipe."
requires-python = ">=3.11"
dependencies = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.10.0",
  "numpy>=1.26,<2.0",
  "scipy>=1.14.0",
  "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
yolo = [
  "ultralytics>=8.3.0",
]

[project.scripts]
basketvision-analyze = "basketvision.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

